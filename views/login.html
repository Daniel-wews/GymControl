<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymControl - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-amber-400 selection:text-slate-900">

    <div
        class="w-full max-w-md bg-slate-800/50 backdrop-blur-md border border-slate-700/50 p-6 sm:p-8 rounded-2xl shadow-2xl text-center">

        <div class="text-3xl font-black tracking-wider text-amber-400 mb-1">
            GYM<span class="text-white">CONTROL</span>
        </div>
        <p class="text-sm text-slate-400 mb-8 font-medium">Sistema de Gerenciamento de Academia</p>

        <div class="text-left mb-4">
            <span class="text-xs font-bold uppercase tracking-widest text-slate-400 block mb-2">Selecione seu perfil de
                acesso:</span>
        </div>

        <div class="space-y-3">

            <button onclick="definirPerfil('admin')"
                class="w-full flex items-center p-4 bg-slate-700/40 hover:bg-slate-700 border border-slate-600/50 hover:border-amber-400/50 rounded-xl transition-all duration-200 group text-left">
                <span
                    class="text-2xl bg-slate-800 p-2 rounded-lg group-hover:scale-110 transition-transform duration-200">👨‍💼</span>
                <div class="ml-4">
                    <div class="font-bold text-slate-200 group-hover:text-amber-400 transition-colors">Administrador
                    </div>
                    <div class="text-xs text-slate-400 line-clamp-1">Gestão completa — alunos, finanças e relatórios
                    </div>
                </div>
            </button>

            <button onclick="definirPerfil('professor')"
                class="w-full flex items-center p-4 bg-slate-700/40 hover:bg-slate-700 border border-slate-600/50 hover:border-amber-400/50 rounded-xl transition-all duration-200 group text-left">
                <span
                    class="text-2xl bg-slate-800 p-2 rounded-lg group-hover:scale-110 transition-transform duration-200">🏋️</span>
                <div class="ml-4">
                    <div class="font-bold text-slate-200 group-hover:text-amber-400 transition-colors">Professor</div>
                    <div class="text-xs text-slate-400 line-clamp-1">Gerenciar treinos e acompanhar alunos</div>
                </div>
            </button>

            <button onclick="definirPerfil('aluno')"
                class="w-full flex items-center p-4 bg-slate-700/40 hover:bg-slate-700 border border-slate-600/50 hover:border-amber-400/50 rounded-xl transition-all duration-200 group text-left">
                <span
                    class="text-2xl bg-slate-800 p-2 rounded-lg group-hover:scale-110 transition-transform duration-200">🏅</span>
                <div class="ml-4">
                    <div class="font-bold text-slate-200 group-hover:text-amber-400 transition-colors">Aluno</div>
                    <div class="text-xs text-slate-400 line-clamp-1">Consultar treinos, pagamentos e frequência</div>
                </div>
            </button>

        </div>

        <div class="mt-8 pt-4 border-t border-slate-700/50 text-xs text-slate-500">
            &copy; 2026 GymControl. Todos os direitos reservados.
        </div>

    </div>

    <script src="../public/js/login.js"></script>
</body>

</html>
